spring.application.name: FluentPipe

spring.datasource.url: ${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name: org.sqlite.JDBC

spring.jpa.database-platform: org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto: validate

spring.flyway.enabled: true
spring.flyway.locations: classpath:db/migration
spring.flyway.baseline-on-migrate: true
spring.flyway.baseline-version: 0

fluentpipe:
  timezone: Europe/Berlin

spring.ai.openai.api-key: ${SPRING_AI_OPENAI_API_KEY}
spring.ai.openai.chat.model: gpt-5.6-luna
spring.ai.openai.audio.speech.options.model: gpt-4o-mini-tts
spring.ai.openai.audio.speech.options.voice: nova
spring.ai.openai.audio.speech.options.response-format: wav
spring.ai.openai.audio.speech.options.speed: 1
spring.ai.openai.audio.speech.instructions: You are a native German speaker. Speak in standard German with accurate German accent and pronunciation. Keep one second pause between each word separated by comma, this is crucial.

ai:
  prompts:
    analyze-word: |
      You are a language learning assistant and expert lexicographer.

      Analyze the given input word or phrase and provide its translation, usage frequency, and a context sentence with its translation.
      No matter in what language a word or a phrase is provided, the main thing is that it is always translated to the target language.

      Input Word: "${INPUT_WORD}"
      Target Language: German
      Native Language: English

      RULES:
      1. "word": The base/dictionary form of the input word ALWAYS in the target language.
      2. "translation": Clear, accurate translation in the native language.
      3. "meaning": A concise definition/explanation written ALWAYS and ENTIRELY in the target language (German), regardless of the input language. NEVER use English, the native language, or mixed-language explanations in this field.
      4. "frequency": Classify the real-world usage frequency into exactly ONE of these values:
                        - VERY_RARE
                        - RARE
                        - MODERATE
                        - OFTEN
                        - VERY_OFTEN
      5. "example": A natural, everyday example sentence in the target language using the word.
      6. "exampleTranslation": Accurate translation of the example sentence in the native language.

      Before responding, verify that "word", "meaning", and "example" are entirely in the target language. Only "translation" and "exampleTranslation" use the native language. Rewrite any "meaning" that violates this rule before returning the JSON.

      Respond ONLY with valid JSON matching this exact structure:
        {
          "word": "string",
          "translation": "string",
          "meaning": "string",
          "frequency": "VERY_RARE | RARE | MODERATE | OFTEN | VERY_OFTEN",
          "example": "string",
          "exampleTranslation": "string"
        }

    ai-word-card: |
      You are a native German language teacher.
      Today is ${DAY_OF_WEEK},${TODAY_DATE}.
      Variation seed for this execution: ${RANDOM_SEED}

      STEP 1: DYNAMIC TOPIC SELECTION
      - Privately brainstorm 12 distinct, specific topics from different areas of everyday life in German-speaking countries. Do not output this brainstorming.
      - Use the variation seed to vary both the candidate topics and the final selection, rather than always choosing the first or most familiar candidate.
      - Choose ONE narrowly focused topic with enough useful B1-C1 vocabulary for a coherent card.
      - Favor overlooked situations, activities, objects, and practical processes over standard textbook topics.
      - Do not default to train delays, apartment viewing, doctor appointments, restaurants, or generic small talk.
      - Do not let the weekday or date force a recurring topic. Prioritize variety over seasonal associations.

      STEP 2: CONTENT SELECTION
      - Generate EXACTLY 7 distinct German vocabulary items closely related to the chosen topic.
      - Strongly prefer SINGLE LEXICAL WORDS: nouns, infinitive verbs, and adjectives. Aim for all 7 items to be single words.
      - Include the correct definite article with every noun. An article plus a noun counts as a single vocabulary word, NOT a phrase.
      - German compound nouns and separable verbs written together in the infinitive count as single words.
      - Allow AT MOST ONE short phrase of 2-3 space-separated words, and only if it teaches an essential expression that a single word cannot adequately replace. A phrase is optional, never required.
      - If the topic does not provide at least 6 useful single words, choose another topic instead of filling the card with phrases.
      - CEFR level: B1-C1. Prefer natural, reusable vocabulary in everyday German over obscure technical terms.
      - Use a useful mix of word classes where natural; do not add synonyms, inflected variants, or near-duplicates just to reach the count.

      CRITICAL CONSTRAINTS:
      - No item may exceed 3 space-separated words, including articles.
      - No complete sentences, clauses, questions, definitions, translations, or explanatory notes.
      - Before responding, verify: exactly 7 unique items, at least 6 single lexical words, at most 1 phrase, and one coherent topic. Replace any item that violates these rules.

      OUTPUT RULES:
      - Respond ONLY with a valid JSON array of strings containing EXACTLY 7 items.
      - Do not include the topic name, reasoning, numbering, or markdown code blocks. Return raw JSON only.
telegram:
  bot-token: "${TELEGRAM_BOT_TOKEN}"
  channel-id: "${TELEGRAM_CHANNEL_ID}"
  owner-id: "${TELEGRAM_OWNER_ID}"

commands:
  - command: /add_term
    callback: /on_word_provided
  - command: /active_word_card
  - command: /remove_term
    callback: /on_term_selected_for_removal
  - command: /preview_word_card
  - command: /publish_word_card
    callback: /on_word_card_publish_decided
  - command: /purge_word_card


news:
  receiver-id: ${telegram.channel-id}
  sources:
    - feed-id: deutsche-welle-gesamt
      feed-url: https://rss.dw.com/xml/rss-de-all
      source-tag: dw